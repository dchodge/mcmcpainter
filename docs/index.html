<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCMC Painter - Redirecting...</title>
    <style>
        body {
            font-family: 'Avenir', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
        }
        h1 {
            font-size: 2.5em;
            font-weight: 300;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
            color: #666666;
        }
        .btn {
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            border-radius: 4px;
            font-size: 1.1em;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s ease;
            font-family: 'Avenir', sans-serif;
        }
        .btn:hover {
            background: #333333;
        }
        .spinner {
            border: 3px solid #f0f0f0;
            border-top: 3px solid #000000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MCMC Painter</h1>
        <p>Redirecting to the web application...</p>
        <div class="spinner"></div>
        <p><a href="/web_app/" class="btn">Go to MCMC Painter</a></p>
        <p><small>If you're not redirected automatically, click the button above.</small></p>
    </div>
    
    <script>
        // Redirect to the web app
        setTimeout(() => {
            window.location.href = '/web_app/';
        }, 2000);
    </script>
</body>
</html>
